title: Certutil Used to Download a File (first version)
id: 6a1f3c55-2d8e-4f0b-9c61-0b7f4e2d9a13
status: experimental
description: >
  The rule in examples/rules as it was first written: it looks for the options with a hyphen
  only, and finds certutil by file name only. Kept here to show what the tests catch.
author: Sri Hari Manikandan
date: 2026-11-01
logsource:
  product: windows
  category: process_creation
detection:
  certutil:
    Image|endswith: '\certutil.exe'
  download:
    CommandLine|contains|all:
      - '-urlcache'
      - '-f'
    CommandLine|contains:
      - 'http://'
      - 'https://'
  filter_update_server:
    CommandLine|contains: 'http://pki.corp.example/'
  condition: certutil and download and not filter_update_server
level: high
